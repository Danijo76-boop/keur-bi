# Vérifications automatiques : lancées à chaque pull request et à chaque mise à jour de main.
# Une pull request dont une étape échoue ne doit pas être fusionnée.
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Types, lint, format, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Base PostgreSQL jetable, uniquement pour les tests (jamais la base de production).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keurbi
          POSTGRES_PASSWORD: keurbi
          POSTGRES_DB: keurbi_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keurbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://keurbi:keurbi@localhost:5432/keurbi_tests
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Types (TypeScript)
        run: npm run types

      - name: Qualité du code (ESLint)
        run: npm run lint

      - name: Mise en forme (Prettier)
        run: npm run format:verifier

      - name: Base de test (migrations)
        run: npx prisma migrate deploy

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
